<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulCut</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1024px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f0f0;
        }
        
        .input-section {
            margin-bottom: 20px;
        }
        
        #urlInput {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        #videoContainer {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            margin-bottom: 20px;
        }
        
        #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .bank-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .bank-button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .bank-button.active {
            outline: 2px solid black;
        }
        
        .pad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .pad {
            aspect-ratio: 1;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            transition: transform 0.1s;
        }
        
        .pad:active {
            transform: scale(0.95);
        }
        
        .pad.active {
            outline: 2px solid black;
        }
        
        .pad .time {
            font-size: 0.7em;
            margin-top: 4px;
        }
        
        .controls {
            margin-bottom: 20px;
        }
        
        .button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .button:hover {
            background: #0056b3;
        }
        
        .instructions {
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
        }

        .progress-bar {
            height: 32px;
            background: #333;
            margin-bottom: 20px;
            position: relative;
            cursor: pointer;
        }

        .progress {
            height: 100%;
            background: rgba(76, 175, 80, 0.2);
            width: 0%;
            transition: width 0.1s;
        }

        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="input-section">
        <input type="text" id="urlInput" placeholder="Paste YouTube URL (e.g., https://www.youtube.com/watch?v=...)">
        <button id="loadButton" class="button" disabled>Load Video</button>
        <div id="status">Initializing YouTube player...</div>
    </div>

    <div id="videoContainer">
        <div id="player"></div>
    </div>

    <div class="controls">
        <button id="playPauseButton" class="button">Play/Pause</button>
        <select id="scrubIncrement">
            <option value="0.1">Fine (0.1s)</option>
            <option value="0.5">Medium (0.5s)</option>
            <option value="1">Coarse (1.0s)</option>
        </select>
    </div>

    <div class="progress-bar" id="progressBar">
        <div class="progress" id="progress"></div>
    </div>

    <div class="bank-section" id="bankButtons"></div>
    
    <div class="pad-grid" id="padGrid"></div>

    <div class="instructions">
        <p>Press 'U' to set cue point for current pad</p>
        <p>Press 'I' to move to next pad</p>
        <p>Use arrow keys to scrub through video</p>
        <p>Press pad keys (1234 QWER ASDF ZXCV) to trigger cue points</p>
    </div>

    <script>
        let player = null;
        let isPlayerReady = false;
        let currentBank = 'A';
        let currentPadIndex = 0;
        let isPlaying = false;
        let scrubIncrement = 0.1;
        
        const keyMap = ['1', '2', '3', '4', 'q', 'w', 'e', 'r', 'a', 's', 'd', 'f', 'z', 'x', 'c', 'v'];
        const banks = ['A', 'B', 'C', 'D'];
        const bankColors = {
            A: '#63B3ED',
            B: '#68D391',
            C: '#F6E05E',
            D: '#B794F4'
        };
        
        const cuePoints = {
            A: {}, B: {}, C: {}, D: {}
        };

        // YouTube API Setup
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '360',
                width: '640',
                videoId: '',
                playerVars: {
                    'playsinline': 1,
                    'controls': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'modestbranding': 1,
                    'iv_load_policy': 3,
                    'disablekb': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function loadVideo() {
            if (!isPlayerReady) {
                document.getElementById('status').textContent = 'Please wait for player to initialize...';
                return;
            }

            const url = document.getElementById('urlInput').value;
            const videoId = extractVideoID(url);
            
            if (!videoId) {
                document.getElementById('status').textContent = 'Invalid YouTube URL. Please check and try again.';
                return;
            }

            document.getElementById('status').textContent = 'Loading video...';
            
            try {
                player.loadVideoById({
                    videoId: videoId,
                    startSeconds: 0,
                    suggestedQuality: 'default'
                });
                
                // Reset all cue points when loading a new video
                Object.keys(cuePoints).forEach(bank => {
                    cuePoints[bank] = {};
                });
                currentPadIndex = 0;
                updateUI();
            } catch (error) {
                document.getElementById('status').textContent = 'Error loading video. Please try again.';
            }
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            document.getElementById('status').textContent = 'Player ready! Enter a YouTube URL to begin.';
            document.getElementById('loadButton').disabled = false;
            setupUI();
        }

        function onPlayerStateChange(event) {
            isPlaying = event.data === YT.PlayerState.PLAYING;
            updatePlayPauseButton();
            if (isPlaying) {
                updateProgress();
            }
        }

        function onPlayerError(event) {
            let errorMessage = 'An error occurred with the YouTube player.';
            switch(event.data) {
                case 2:
                    errorMessage = 'Invalid YouTube URL or video ID.';
                    break;
                case 5:
                    errorMessage = 'HTML5 player error.';
                    break;
                case 100:
                    errorMessage = 'Video not found or removed.';
                    break;
                case 101:
                case 150:
                    errorMessage = 'Video does not allow embedding.';
                    break;
            }
            document.getElementById('status').textContent = errorMessage;
        }

        function setupUI() {
            setupBankButtons();
            setupPadGrid();
            setupEventListeners();
            updateUI();
        }

        function setupBankButtons() {
            const container = document.getElementById('bankButtons');
            banks.forEach(bank => {
                const button = document.createElement('button');
                button.className = 'bank-button';
                button.textContent = `Bank ${bank}`;
                button.style.backgroundColor = bankColors[bank];
                button.onclick = () => {
                    currentBank = bank;
                    updateUI();
                };
                container.appendChild(button);
            });
        }

        function setupPadGrid() {
            const container = document.getElementById('padGrid');
            keyMap.forEach((key, index) => {
                const pad = document.createElement('button');
                pad.className = 'pad';
                pad.innerHTML = `${key.toUpperCase()}<div class="time"></div>`;
                pad.style.backgroundColor = bankColors[currentBank];
                pad.onclick = () => triggerPad(index);
                container.appendChild(pad);
            });
        }

        function setupEventListeners() {
            document.getElementById('loadButton').onclick = loadVideo;
            document.getElementById('playPauseButton').onclick = togglePlayPause;
            document.getElementById('scrubIncrement').onchange = (e) => {
                scrubIncrement = parseFloat(e.target.value);
            };
            document.getElementById('progressBar').onclick = (e) => {
                const rect = e.target.getBoundingClientRect();
                const ratio = (e.clientX - rect.left) / rect.width;
                if (player && player.getDuration) {
                    player.seekTo(player.getDuration() * ratio);
                }
            };

            document.addEventListener('keydown', handleKeyPress);
        }

        function handleKeyPress(e) {
            if (!isPlayerReady) return;

            if (keyMap.includes(e.key.toLowerCase())) {
                triggerPad(keyMap.indexOf(e.key.toLowerCase()));
            } else if (e.key === 'u') {
                setCuePoint();
            } else if (e.key === 'i') {
                moveToNextPad();
            } else if (e.key === 'ArrowLeft') {
                scrubVideo(-scrubIncrement);
            } else if (e.key === 'ArrowRight') {
                scrubVideo(scrubIncrement);
            }
        }

        function togglePlayPause() {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function updatePlayPauseButton() {
            document.getElementById('playPauseButton').textContent = isPlaying ? 'Pause' : 'Play';
        }

        function scrubVideo(amount) {
            if (!player || !player.getCurrentTime) return;
            const currentTime = player.getCurrentTime();
            const duration = player.getDuration();
            const newTime = Math.max(0, Math.min(duration, currentTime + amount));
            player.seekTo(newTime);
        }

        function triggerPad(index) {
            if (!player || !cuePoints[currentBank][index]) return;
            player.seekTo(cuePoints[currentBank][index]);
            player.playVideo();
        }

        function setCuePoint() {
            if (!player || !player.getCurrentTime) return;
            const currentTime = player.getCurrentTime();
            cuePoints[currentBank][currentPadIndex] = currentTime;
            updateUI();
            document.getElementById('status').textContent = `Cue point set at ${currentTime.toFixed(2)}s`;
        }

        function moveToNextPad() {
            currentPadIndex = (currentPadIndex + 1) % keyMap.length;
            if (currentPadIndex === 0) {
                if (confirm('Move to next bank?')) {
                    const currentBankIndex = banks.indexOf(currentBank);
                    currentBank = banks[(currentBankIndex + 1) % banks.length];
                }
            }
            updateUI();
        }

        function updateUI() {
            updateBankButtons();
            updatePadGrid();
        }

        function updateBankButtons() {
            document.querySelectorAll('.bank-button').forEach((button, index) => {
                button.className = `bank-button ${banks[index] === currentBank ? 'active' : ''}`;
            });
        }

        function updatePadGrid() {
            document.querySelectorAll('.pad').forEach((pad, index) => {
                pad.style.backgroundColor = bankColors[currentBank];
                pad.className = `pad ${index === currentPadIndex ? 'active' : ''}`;
                const timeDiv = pad.querySelector('.time');
                timeDiv.textContent = cuePoints[currentBank][index] ? 
                    `${cuePoints[currentBank][index].toFixed(2)}s` : '';
            });
        }

        function updateProgress() {
            if (!player || !isPlaying) return;
            const progress = document.getElementById('progress');
            const currentTime = player.getCurrentTime();
            const duration = player.getDuration();
            progress.style.width = (currentTime / duration) * 100 + '%';
            requestAnimationFrame(updateProgress);
        }

        function extractVideoID(url) {
            const regex = /(?:https?:\/\/(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|(?:v%2F|\S+)\/)(?:[\w\-]+))|youtu\.be\/([\w\-]+))/;
            const match = url.match(regex);
            return match ? (match[1] || match[2]) : null;
        }

    </script>
</body>
</html>
